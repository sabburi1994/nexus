[project]
name = "nexus-showcase"
version = "0.2.0"
description = "Reference Showcase & Documentation Portal demonstrating Nexus Agent Framework (https://nexus.abburi.info)"
requires-python = ">=3.11"
dependencies = [
    "nexus-agent-framework>=0.2.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
