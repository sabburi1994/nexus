[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus-agent-framework"
version = "0.2.0"
description = "Autonomous Agentic Software Engineering Framework & Virtual IT Squad powered by Google Gemini and MCP — https://nexus.abburi.info"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Sai Nikhil Abburi", email = "sai.nikhil@abburi.info" }
]
keywords = [
    "ai-agents",
    "autonomous-agents",
    "gemini",
    "vertex-ai",
    "mcp",
    "model-context-protocol",
    "software-engineering",
    "fastapi",
    "terraform",
    "cloud-run",
    "orchestrator",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Build Tools",
    "Framework :: FastAPI",
    "Framework :: AsyncIO",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.urls]
Homepage = "https://nexus.abburi.info"
Documentation = "https://nexus.abburi.info/#docs"
Simulator = "https://nexus.abburi.info/#simulator"
Repository = "https://github.com/sabburi1994/nexus"
Issues = "https://github.com/sabburi1994/nexus/issues"
Changelog = "https://github.com/sabburi1994/nexus/releases"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
]

[project.scripts]
nexus = "nexus.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "UP036", "UP042"]
