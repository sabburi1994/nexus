name: Release & Package Distribution

on:
  release:
    types: [published]
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build-and-publish-python:
    name: Build & Publish Python Wheel (nexus-framework)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build tools & twine
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: |
          python -m build

      - name: Verify package distributions
        run: |
          twine check dist/*

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/v') && env.HAVE_PYPI_TOKEN == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
        env:
          HAVE_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN != '' }}

  build-and-publish-npm:
    name: Build & Publish TypeScript Packages (@nexus/*)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Install TypeScript and type definitions
        run: |
          npm install --no-save typescript @types/react @types/react-dom

      - name: Compile all monorepo packages
        run: |
          npx tsc -p packages/contracts
          npx tsc -p packages/middleware
          npx tsc -p packages/scraper
          npx tsc -p packages/ui

      - name: Publish @nexus/* to NPM Registry
        if: startsWith(github.ref, 'refs/tags/v') && env.HAVE_NPM_TOKEN == 'true'
        run: |
          for pkg in contracts middleware scraper ui; do
            echo "Publishing packages/$pkg..."
            cd packages/$pkg
            npm publish --access public || echo "Skipping $pkg or already published"
            cd ../..
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          HAVE_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
