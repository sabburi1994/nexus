# Release & package distribution with OIDC trusted publishing (no long lived registry tokens).
#
# GitHub Actions is currently disabled for this repository, so this workflow does not run.
# Before enabling it the owner must, once:
#   * PyPI: add a trusted publisher for project nexus-agent-framework
#     (owner sabburi1994, repository nexus, workflow release.yml, environment pypi);
#   * npm: for each @nexus-agent-framework/* package add a trusted publisher
#     (GitHub Actions, sabburi1994/nexus, workflow release.yml, environment npm);
#   * GitHub: create environments "pypi" and "npm" with the owner as required reviewer;
#   * delete any PYPI_API_TOKEN / NPM_TOKEN repository secrets and revoke the tokens.
# Third party actions are pinned to full commit SHAs.

name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-python:
    name: Build Python distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build and check sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Check tag matches package version
        run: |
          version="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "${GITHUB_REF_NAME#v}" = "$version" || { echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1; }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI (trusted publishing)
    needs: build-python
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/nexus-agent-framework/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/

  publish-npm:
    name: Publish @nexus-agent-framework/* to npm (trusted publishing)
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/org/nexus-agent-framework
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Ensure npm supports trusted publishing (11.5.1 or newer)
        run: npm install -g npm@^11.5.1

      - name: Install and build packages
        run: |
          npm ci
          npx tsc -p packages/contracts
          npx tsc -p packages/middleware
          npx tsc -p packages/scraper
          npx tsc -p packages/ui

      - name: Publish packages whose version is not on npm yet
        run: |
          for pkg in contracts middleware scraper ui; do
            name="$(node -p "require('./packages/$pkg/package.json').name")"
            version="$(node -p "require('./packages/$pkg/package.json').version")"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already published, skipping"
              continue
            fi
            echo "Publishing $name@$version"
            (cd "packages/$pkg" && npm publish --access public)
          done
